name = "tasks-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (must stay set, or deploys remove it from the live worker)
route = { pattern = "tasks-api.libinfaby.dev", custom_domain = true }

[[d1_databases]]
binding = "DB"
database_name = "tasks-db"
database_id = "df7676db-0acc-4c23-be8f-5cbeccb5e90a"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
ALLOWED_ORIGIN = "https://tasks.libinfaby.dev"
JWT_EXPIRY = "7d"
# IANA zone that recurring reminders step in (keeps 09:00 at 09:00 local)
TIMEZONE = "Asia/Kolkata"
VAPID_PUBLIC_KEY = "BFVyvXzPSMJ9BZG4yw3elgHT7w6H8MTqT60eKfr2o1nIaLfmLyh_vc4C8BQ11QyLNnWdpQP-ZntIhHwrDLtiC7Y"
# VAPID_PRIVATE_KEY is a secret: `wrangler secret put VAPID_PRIVATE_KEY` (local: worker/.dev.vars)
VAPID_SUBJECT = "mailto:admin@libinfaby.dev"
