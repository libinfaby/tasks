<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
    content="Tasks - A personal task manager with subtasks, tags, priority management, and group organization.">
  <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The Android app's type: Bricolage Grotesque for display and headlines, Figtree for everything else -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint (no flash); unset = follow the OS
    try { const t = localStorage.getItem('tasks_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <div id="app"></div>

  <!-- Snackbars -->
  <div class="snackbar-host" id="snackbar-host" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
